<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Event reply form example</title>
</head>
<body>
  <!-- Replace CLAIM_YOUR_ENDPOINT with the endpoint from https://lamofel.com/?ref=github-examples -->
  <form action="https://lamofel.com/f/CLAIM_YOUR_ENDPOINT" method="POST">
    <h1>Event reply</h1>

    <p>
      <label for="name">Your name</label><br>
      <input type="text" id="name" name="name" required>
    </p>
    <p>
      <label for="email">Your email</label><br>
      <input type="email" id="email" name="email" required>
    </p>
    <p>
      <label for="attending">Will you attend?</label><br>
      <select id="attending" name="attending" required>
        <option value="">Choose one</option>
        <option value="yes">Yes</option>
        <option value="no">No</option>
        <option value="maybe">Maybe</option>
      </select>
    </p>
    <p>
      <label for="guests">Number of guests, including you</label><br>
      <input type="number" id="guests" name="guests" min="1" max="20" value="1">
    </p>
    <p>
      <label for="notes">Dietary needs or notes (optional)</label><br>
      <textarea id="notes" name="notes" rows="3"></textarea>
    </p>
    <input type="text" name="_gotcha" tabindex="-1" autocomplete="off" hidden>
    <p><button type="submit">Send reply</button></p>
  </form>
</body>
</html>
